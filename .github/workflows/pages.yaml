name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

# Pages serves the gh-pages branch so PR previews can live beside the site
# under pr-preview/. Deploying from an Actions artifact would replace them.
permissions:
  contents: write

# Shares the group with PR previews so writes to gh-pages never race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
